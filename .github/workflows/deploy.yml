name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Проверка исходного кода
      - uses: actions/checkout@v2

      # Шаг 2: Настройка SSH ключа
      - run: set -eu
      - run: mkdir "$HOME/.ssh"
      - run: echo "${{ secrets.key }}" > "$HOME/.ssh/key"
      - run: chmod 600 "$HOME/.ssh/key"

      # Шаг 3: Установка зависимостей для фронтенда и сборка
      - run: cd client && npm install
      - run: cd client && npm run build

      # Шаг 4: Проверка, что директория dist существует
      - run: |
          if [ -d "client/dist" ]; then
            echo "Build directory exists, proceeding with deployment"
          else
            echo "Build directory does not exist, aborting deployment"
            exit 1
          fi

      # Шаг 5: Синхронизация фронтенда (dist) с сервером
      - run: rsync -e "ssh -p 20022 -i $HOME/.ssh/key -o StrictHostKeyChecking=no" --archive --compress --delete ./client/dist/ n132844@n132844.hostnl1.fornex.org:/home/n132844/public_html/doctoraibolit.kz

      # Шаг 6: Установка зависимостей для бэкенда (TypeScript и другие зависимости)
      - run: cd server && npm ci

      # Шаг 7: Компиляция TypeScript в JavaScript
      - run: cd server && npx tsc

      # Шаг 8: Синхронизация серверного кода с сервером (из папки server)
      - run: rsync -e "ssh -p 20022 -i $HOME/.ssh/key -o StrictHostKeyChecking=no" --archive --compress --delete ./server/ n132844@n132844.hostnl1.fornex.org:/home/n132844/server
